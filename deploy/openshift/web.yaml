apiVersion: apps/v1
kind: Deployment
metadata:
  name: assetpulse-web
  labels:
    app: assetpulse-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: assetpulse-web
  template:
    metadata:
      labels:
        app: assetpulse-web
    spec:
      containers:
        - name: web
          image: image-registry.openshift-image-registry.svc:5000/your-project/assetpulse-web:latest
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: assetpulse-web
spec:
  selector:
    app: assetpulse-web
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: assetpulse
spec:
  to:
    kind: Service
    name: assetpulse-web
  port:
    targetPort: http
  tls:
    termination: edge
