spring:
  application:
    name: assetpulse-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/assetpulse}
    username: ${SPRING_DATASOURCE_USERNAME:assetpulse}
    password: ${SPRING_DATASOURCE_PASSWORD:assetpulse}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: assetpulse-sensor-rules
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.assetpulse.api.sensor
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
server:
  port: ${PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
app:
  jwt:
    secret: ${APP_JWT_SECRET}
    expiration: PT8H
  bootstrap:
    username: ${APP_BOOTSTRAP_USERNAME:admin}
    password: ${APP_BOOTSTRAP_PASSWORD}
  kafka:
    sensor-topic: sensor.readings
